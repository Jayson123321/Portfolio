services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: Jaysonportfolio
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./apps/api
    ports:
      - "8000:8000"
    env_file:
      - ./apps/api/.env
    volumes:
      - ./apps/api:/app
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      target: build
    command: npm run start
    ports:
      - "3000:3000"
    environment:
      API_URL: http://api:8000
    volumes:
      - ./apps/web:/usr/src/app
      - /usr/src/app/node_modules  
      - /usr/src/app/.next
    depends_on:
      - api

volumes:
  postgres_data: